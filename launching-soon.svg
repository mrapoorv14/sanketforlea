<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Sanket — launching soon">
  <title>Sanket — launching soon</title>
  <defs>
    <!-- upright lettering: top arc runs clockwise, bottom arc counter-clockwise -->
    <path id="arc-top" d="M 24,100 a 76,76 0 0,1 152,0"/>
    <path id="arc-bottom" d="M 36,100 a 64,64 0 0,0 128,0"/>
    <style>
      .sweep { animation: sweep 22s linear infinite; transform-origin: 100px 100px; }
      @keyframes sweep { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
    </style>
  </defs>

  <!-- two hairlines: the plate -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#c6a15b" stroke-width="1" opacity=".55"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#f5f0e4" stroke-width=".6" opacity=".22"/>

  <!-- a single light sweep travelling the rim, instead of spinning rings -->
  <path class="sweep" d="M 100,8.5 A 91.5,91.5 0 0,1 180,53" fill="none" stroke="#c6a15b"
        stroke-width="1.6" stroke-linecap="round" opacity=".5"/>

  <!-- engraved lettering -->
  <text font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="14"
        font-weight="500" letter-spacing="4.4" fill="#f5f0e4">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">LAUNCHING SOON</textPath>
  </text>
  <text font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="8.5"
        font-weight="500" letter-spacing="4.8" fill="#c6a15b" opacity=".9">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">SANKET</textPath>
  </text>

  <!-- lozenge separators where the two inscriptions meet -->
  <path d="M 30,96.2 l 3.4,3.8 -3.4,3.8 -3.4,-3.8 z" fill="#c6a15b" opacity=".85"/>
  <path d="M 170,96.2 l 3.4,3.8 -3.4,3.8 -3.4,-3.8 z" fill="#c6a15b" opacity=".85"/>

  <!-- the mark, left quiet: outer ring, the gold detection arc, the subject -->
  <g transform="translate(100 100) scale(1.02) translate(-32 -32)">
    <path d="M 51.92 30.26 A 20 20 0 1 1 40.45 13.87" fill="none" stroke="#f5f0e4" stroke-width="1.9"
          stroke-linecap="round" opacity=".85"/>
    <path d="M 40.45 13.87 A 20 20 0 0 1 51.92 30.26" fill="none" stroke="#c6a15b" stroke-width="2.4"
          stroke-linecap="round"/>
    <circle cx="51.92" cy="30.26" r="2.6" fill="#c6a15b"/>
    <circle cx="32" cy="32" r="3.4" fill="#c6a15b"/>
  </g>
</svg>
